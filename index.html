<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="theme-color-meta" content="#f8f9fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Prompt Archive</title>
    
    <!-- Favicon e Icono de App vinculados a GitHub -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/aarondlth3/prompt_library/db2742d60b506c32eef9edcfb16470440049840a/images/Logo.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/aarondlth3/prompt_library/db2742d60b506c32eef9edcfb16470440049840a/images/Logo.png">
    
    <link rel="preconnect" href="https://drive.google.com" crossorigin>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-color: #f8f9fa;
        }
        .dark body, body.dark {
            background-color: #08080A;
        }
        
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        
        /* Fusión del logo con el fondo para quitar el recuadro blanco */
        .logo-blend { filter: invert(1); mix-blend-mode: multiply; }
        .dark .logo-blend { filter: invert(0); mix-blend-mode: screen; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.35); border-radius: 4px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* Acordeón */
        .collapsible-panel {
            transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .collapsible-panel.open {
            max-height: 500px;
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-900 dark:text-white min-h-screen flex flex-col pb-36 selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- ENCABEZADO -->
    <header class="w-full max-w-[1400px] mx-auto px-4 sm:px-6 pt-6 pb-4">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
                <img src="https://raw.githubusercontent.com/aarondlth3/prompt_library/db2742d60b506c32eef9edcfb16470440049840a/images/Logo.png" alt="Prompt Archive" class="h-9 sm:h-12 w-auto object-contain logo-blend transition-all duration-300 select-none">
            </div>

            <!-- Botones de Acción Derecha -->
            <div class="flex items-center gap-1.5 sm:gap-2.5 flex-shrink-0">
                
                <!-- Buscador Desplegable -->
                <div class="relative flex items-center">
                    <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="Buscar..." class="w-0 opacity-0 transition-all duration-300 bg-gray-200 dark:bg-[#16161A] text-gray-900 dark:text-white rounded-full py-2 px-0 outline-none text-xs absolute right-12">
                    <button onclick="toggleSearchBar()" class="w-10 h-10 rounded-full bg-white dark:bg-[#16161A] border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-white/70 hover:text-black dark:hover:text-white transition-all shadow-sm z-10" title="Buscar">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </button>
                </div>

                <!-- Botón Sincronización -->
                <button onclick="openSettingsModal()" class="w-10 h-10 rounded-full bg-white dark:bg-[#16161A] border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-white/70 hover:text-black dark:hover:text-white transition-all shadow-sm" title="Sincronización">
                    <svg id="syncHeaderIcon" class="w-4 h-4 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>

                <!-- Botón Tema -->
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-[#16161A] border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-white/70 hover:text-black dark:hover:text-white transition-all shadow-sm" title="Tema">
                    <svg class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                </button>

                <!-- Botón Nuevo -->
                <button onclick="openNewPromptModal()" class="w-10 h-10 rounded-full bg-gray-900 text-white dark:bg-white dark:text-black hover:scale-105 transition-transform flex items-center justify-center shadow-md">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL (GALERÍA 9:16) -->
    <main class="max-w-[1400px] w-full mx-auto px-4 sm:px-6 pt-2 flex-grow relative">
        <div id="promptCatalog" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3.5 sm:gap-5 items-start">
            <!-- Las tarjetas se generan aquí una sola vez -->
        </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <svg class="h-10 w-10 text-gray-300 dark:text-white/20 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            <p class="text-xs font-bold tracking-widest uppercase text-gray-400 dark:text-white/40">Sin Resultados</p>
        </div>
    </main>

    <!-- DOCK INFERIOR LIQUID GLASS -->
    <div class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-40 max-w-[95vw] bg-white/70 dark:bg-[#16161A]/70 backdrop-blur-2xl backdrop-saturate-150 border border-white/60 dark:border-white/10 shadow-2xl rounded-full p-1.5 flex items-center gap-1">
        <button onclick="switchTab('imagenes')" id="tabBtn_imagenes" class="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold bg-gray-900 text-white dark:bg-white dark:text-black shadow-sm transition-all" title="Poses">
            <span class="text-sm">📸</span><span class="hidden sm:inline">Poses</span>
        </button>
        <button onclick="switchTab('outfits')" id="tabBtn_outfits" class="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold text-gray-500 dark:text-white/60 hover:text-black dark:hover:text-white transition-all" title="Outfits">
            <span class="text-sm">👗</span><span class="hidden sm:inline">Outfits</span>
        </button>
        <button onclick="switchTab('modificadores')" id="tabBtn_modificadores" class="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold text-gray-500 dark:text-white/60 hover:text-black dark:hover:text-white transition-all" title="Elementos">
            <span class="text-sm">✨</span><span class="hidden sm:inline">Elementos</span>
        </button>
        <button onclick="switchTab('videos')" id="tabBtn_videos" class="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold text-gray-500 dark:text-white/60 hover:text-black dark:hover:text-white transition-all" title="Videos">
            <span class="text-sm">🎬</span><span class="hidden sm:inline">Videos</span>
        </button>
        
        <div class="w-px h-5 bg-gray-300 dark:bg-white/20 mx-1"></div>
        
        <!-- Botón Filtro Desplegable -->
        <div class="relative">
            <button onclick="toggleFilterMenu()" class="w-9 h-9 flex items-center justify-center rounded-full text-gray-600 dark:text-white/80 hover:bg-white dark:hover:bg-white/10 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                <span id="filterActiveDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full border border-white dark:border-[#16161A]"></span>
            </button>
            <!-- Menú Flotante Filtros -->
            <div id="filterDropdown" class="hidden absolute bottom-[120%] right-0 mb-2 bg-white/95 dark:bg-[#1C1C22]/95 backdrop-blur-xl border border-gray-200 dark:border-white/10 rounded-2xl shadow-xl p-3 w-48 z-50">
                <div id="filterPeopleSection" class="mb-3">
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1.5">Personas</label>
                    <div class="flex gap-1 bg-gray-100 dark:bg-black/30 p-1 rounded-xl">
                        <button onclick="switchPeopleFilter('all')" id="fBtn_all" class="flex-1 py-1 text-[10px] font-bold rounded bg-white dark:bg-white/10 text-black dark:text-white shadow-sm">All</button>
                        <button onclick="switchPeopleFilter('1')" id="fBtn_1" class="flex-1 py-1 text-[10px] font-bold rounded text-gray-500 hover:text-black dark:hover:text-white">1P</button>
                        <button onclick="switchPeopleFilter('2')" id="fBtn_2" class="flex-1 py-1 text-[10px] font-bold rounded text-gray-500 hover:text-black dark:hover:text-white">2P</button>
                        <button onclick="switchPeopleFilter('3')" id="fBtn_3" class="flex-1 py-1 text-[10px] font-bold rounded text-gray-500 hover:text-black dark:hover:text-white">3P</button>
                    </div>
                </div>
                <div id="filterTagsSection">
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1.5">Tags</label>
                    <div id="filterTagsList" class="flex flex-wrap gap-1 max-h-32 overflow-y-auto custom-scrollbar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL MULTI-TAGS -->
    <div id="multiTagModal" class="hidden fixed inset-0 z-[70] flex items-end sm:items-center justify-center modal-overlay transition-all">
        <div class="w-full sm:max-w-md bg-white dark:bg-[#16161A] border dark:border-white/10 rounded-t-[32px] sm:rounded-[32px] p-6 pb-8 flex flex-col max-h-[85vh] shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h3 class="font-montserrat font-bold text-lg text-gray-900 dark:text-white">Seleccionar Tags</h3>
                <button onclick="closeMultiTagModal()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-white/10 flex items-center justify-center text-gray-600 dark:text-white hover:bg-gray-200">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="flex-grow overflow-y-auto custom-scrollbar mb-4">
                <div id="multiTagList" class="flex flex-wrap gap-1.5"></div>
            </div>
            
            <div class="border-t border-gray-200 dark:border-white/10 pt-4">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="multiTagInput" placeholder="Escribir nuevo tag..." class="flex-1 bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent focus:border-indigo-500 rounded-xl px-4 py-2.5 text-xs outline-none text-gray-900 dark:text-white transition-colors">
                    <button onclick="addAndSelectTag()" class="bg-gray-900 dark:bg-white text-white dark:text-black px-4 rounded-xl text-xs font-bold hover:bg-gray-800 transition-colors">+</button>
                </div>
                <button onclick="applyMultiTags()" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg hover:bg-indigo-500 transition-colors">Aplicar Tags</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLE INMERSIVO -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-overlay transition-all">
        <div class="w-full h-[96vh] sm:h-[90vh] sm:max-w-[440px] bg-white dark:bg-[#08080A] sm:border border-gray-200 dark:border-white/10 sm:rounded-[36px] rounded-t-[36px] shadow-2xl relative overflow-y-auto custom-scrollbar transition-colors">

            <!-- Botón Atrás Flotante -->
            <button onclick="closeDetailModal()" class="absolute top-5 left-5 z-40 w-10 h-10 rounded-full bg-black/40 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow-lg">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>

            <!-- SECCIÓN SUPERIOR: IMAGEN 9:16 -->
            <div class="relative w-full aspect-[9/16] max-h-[68vh] bg-gray-100 dark:bg-[#121216] overflow-hidden flex items-center justify-center">
                <img id="detailModalBg" src="" class="w-full h-full object-cover object-top transition-all duration-500">
                <div id="detailModalBgFallback" class="hidden absolute inset-0 bg-gray-200 dark:bg-[#121216] flex items-center justify-center">
                    <svg class="w-12 h-12 text-gray-400 dark:text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
                
                <!-- Degradado Fundido con el fondo inferior -->
                <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-white via-white/60 to-transparent dark:from-[#08080A] dark:via-[#08080A]/60 dark:to-transparent pointer-events-none"></div>

                <!-- Botones Acciones Flotantes -->
                <div class="absolute right-4 bottom-8 flex flex-col gap-3 z-30">
                    <button onclick="deleteActivePrompt(event)" class="w-10 h-10 rounded-full bg-red-600/90 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow-lg" title="Eliminar Prompt">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                    <div class="relative">
                        <input type="file" id="detailFile" class="hidden" accept="image/*,image/gif" onchange="handleImageFileSelect(this, 'detailLocalPreviewContainer', 'detailLocalPreview')">
                        <button onclick="triggerFileInput('detailFile')" class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow-lg" title="Cambiar Foto">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </button>
                    </div>
                </div>

                <!-- Mini Previsualización Foto Nueva -->
                <div id="detailLocalPreviewContainer" class="hidden absolute top-20 right-4 z-40 bg-white dark:bg-black/80 backdrop-blur-md p-1.5 rounded-xl border border-gray-200 dark:border-white/20 shadow-xl flex flex-col items-center gap-1.5">
                    <img id="detailLocalPreview" src="" class="w-12 h-16 object-cover rounded-lg">
                    <button type="button" onclick="updateThumbnailOnly(event)" class="bg-indigo-600 text-white text-[9px] font-bold uppercase px-2 py-1.5 rounded-lg flex items-center justify-center w-full">
                        <span id="updateThumbSpinner" class="hidden animate-spin h-2.5 w-2.5 border border-white border-t-transparent rounded-full mr-1"></span>Aplicar
                    </button>
                    <button type="button" onclick="removeSelectedImage(event, 'detailFile', 'detailLocalPreviewContainer', '')" class="text-gray-400 hover:text-red-500 w-full text-center pb-0.5"><svg class="h-3 w-3 mx-auto" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg></button>
                </div>
            </div>

            <!-- SECCIÓN INFERIOR: INFORMACIÓN -->
            <div class="px-5 pt-0 pb-8 bg-white dark:bg-[#08080A] relative z-20">
                <h2 id="detailName" class="font-montserrat text-2xl font-bold text-gray-900 dark:text-white tracking-tight leading-tight mb-2">Título</h2>
                
                <!-- Píldoras de Configuración Rápidas -->
                <div class="flex flex-wrap items-center gap-1.5 mb-6">
                    <!-- Personas -->
                    <div id="detailPeoplePill" class="relative bg-gray-100 dark:bg-[#16161A] rounded-full px-2.5 py-1.5 border border-gray-200 dark:border-white/5 flex items-center gap-1">
                        <span class="text-xs">👥</span>
                        <select id="detailPeopleSelect" onchange="updatePeopleCount(event)" class="bg-transparent text-gray-800 dark:text-white text-[10px] font-bold outline-none cursor-pointer appearance-none pr-3">
                            <option value="1">1 Persona</option><option value="2">2 Personas</option><option value="3">3 Personas</option>
                        </select>
                    </div>
                    <!-- Tags (Abre Modal Múltiple) -->
                    <div id="detailTagBtn" class="bg-gray-100 dark:bg-[#16161A] rounded-full px-2.5 py-1.5 border border-gray-200 dark:border-white/5 flex items-center gap-1.5 cursor-pointer hover:bg-gray-200 dark:hover:bg-white/10 transition-colors" onclick="openMultiTagModal('detail')">
                        <span class="text-xs">🏷️</span>
                        <span id="detailSelectedTags" class="text-[10px] font-bold text-gray-800 dark:text-white truncate max-w-[140px]">Sin tags</span>
                    </div>
                </div>

                <!-- Bloques de Video -->
                <div id="videoBlockSelectorContainer" class="hidden mb-5">
                    <div class="flex gap-1.5 bg-gray-100 dark:bg-[#16161A] p-1 rounded-xl">
                        <button id="modalBlockBtn_b1" onclick="switchModalBlock('b1')" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Bloque 1</button>
                        <button id="modalBlockBtn_b2" onclick="switchModalBlock('b2')" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Bloque 2</button>
                        <button id="modalBlockBtn_b3" onclick="switchModalBlock('b3')" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Bloque 3</button>
                    </div>
                </div>

                <!-- Historial de Versiones (Acordeón) -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-gray-400">Versiones del Prompt</span>
                    </div>
                    <div id="detailVersionsContainer" class="space-y-2 mb-4"></div>
                </div>

                <!-- Input Nueva Versión -->
                <div class="pt-4 border-t border-gray-100 dark:border-white/10">
                    <div class="relative flex items-center">
                        <textarea id="newVersionText" rows="1" placeholder="Añadir nueva versión..." class="w-full bg-gray-50 dark:bg-[#16161A] border border-gray-200 dark:border-transparent focus:border-indigo-500 rounded-xl py-3 pl-4 pr-12 text-xs text-gray-900 dark:text-white outline-none resize-none custom-scrollbar transition-colors"></textarea>
                        <button onclick="saveNewVersion()" class="absolute right-2 w-8 h-8 rounded-lg bg-gray-900 dark:bg-white text-white dark:text-black flex items-center justify-center hover:scale-105 transition-transform">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO PROMPT -->
    <div id="newPromptModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeNewPromptModal()"></div>
        <div class="bg-white dark:bg-[#121216] border border-gray-200 dark:border-white/10 w-full max-w-md p-6 relative z-10 rounded-[32px] shadow-2xl max-h-[90vh] flex flex-col">
            <h2 class="font-montserrat text-xl font-bold text-gray-900 dark:text-white mb-5">Nuevo Recurso</h2>
            
            <div class="overflow-y-auto custom-scrollbar space-y-4 pr-1 flex-grow">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-1">
                        <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Categoría</label>
                        <select id="promptCategory" onchange="handleCategoryChange()" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-2.5 text-xs font-semibold text-gray-900 dark:text-white outline-none">
                            <option value="imagenes">📸 Poses</option><option value="outfits">👗 Outfits</option><option value="modificadores">✨ Elementos</option><option value="videos">🎬 Videos (GIFs)</option>
                        </select>
                    </div>
                    <div id="newPromptPeopleWrapper" class="col-span-1">
                        <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Personas</label>
                        <select id="promptPeople" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-2.5 text-xs font-semibold text-gray-900 dark:text-white outline-none">
                            <option value="1">1 Persona</option><option value="2">2 Personas</option><option value="3">3 Personas</option>
                        </select>
                    </div>
                    <div id="newPromptSubCatWrapper" class="col-span-2">
                        <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Tags Múltiples</label>
                        <div class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl py-2.5 px-3 text-xs font-semibold cursor-pointer flex justify-between items-center text-gray-500 dark:text-white/60" onclick="openMultiTagModal('new')">
                            <span id="newPromptSelectedTags" data-tags="" class="truncate">Seleccionar tags...</span>
                            <span class="text-indigo-500">+</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Título</label>
                    <input type="text" id="promptName" placeholder="Ej: Retrato Nocturno..." class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-3 text-sm font-semibold text-gray-900 dark:text-white outline-none">
                </div>
                
                <div id="singlePromptFieldContainer">
                    <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Texto del Prompt</label>
                    <textarea id="promptText" rows="3" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-3 text-xs text-gray-900 dark:text-white outline-none resize-none custom-scrollbar"></textarea>
                </div>

                <div id="videoBlocksFieldContainer" class="hidden space-y-2">
                    <textarea id="block1Text" rows="2" placeholder="B1: Inicio" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-2 text-xs text-gray-900 dark:text-white outline-none"></textarea>
                    <textarea id="block2Text" rows="2" placeholder="B2: Cuerpo" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-2 text-xs text-gray-900 dark:text-white outline-none"></textarea>
                    <textarea id="block3Text" rows="2" placeholder="B3: Cierre" class="w-full bg-gray-50 dark:bg-[#1C1C22] border border-gray-200 dark:border-transparent rounded-xl p-2 text-xs text-gray-900 dark:text-white outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-[9px] uppercase font-bold text-gray-400 tracking-wider mb-1">Archivo (Imagen o GIF 9:16)</label>
                    <div class="border-2 border-dashed border-gray-200 dark:border-white/20 bg-gray-50 dark:bg-[#1C1C22]/50 rounded-xl p-4 text-center cursor-pointer hover:border-indigo-500 transition-colors flex flex-col items-center justify-center relative min-h-[120px]" onclick="triggerFileInput('newPromptFile')">
                        <input type="file" id="newPromptFile" class="hidden" accept="image/*,image/gif" onchange="handleImageFileSelect(this, 'newPromptPreviewContainer', 'newPromptPreview')">
                        <div id="newPromptDropPlaceholder">
                            <svg class="mx-auto h-6 w-6 text-gray-300 dark:text-white/30 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            <p class="text-[10px] text-gray-400">Click para subir JPG/PNG/GIF</p>
                        </div>
                        <div id="newPromptPreviewContainer" class="hidden absolute inset-2 bg-black rounded-lg overflow-hidden flex items-center justify-center">
                            <img id="newPromptPreview" src="" class="h-full w-full object-cover">
                            <button type="button" onclick="removeSelectedImage(event, 'newPromptFile', 'newPromptPreviewContainer', 'newPromptDropPlaceholder')" class="absolute top-1.5 right-1.5 bg-black/60 text-white rounded-full p-1 hover:bg-red-500"><svg class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg></button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2 pt-4 mt-2 border-t border-gray-100 dark:border-white/10">
                <button onclick="closeNewPromptModal()" class="flex-1 bg-gray-100 dark:bg-white/5 text-gray-600 dark:text-white/70 rounded-xl text-xs font-bold py-3.5">Cancelar</button>
                <button onclick="saveNewPrompt()" class="flex-1 bg-gray-900 text-white dark:bg-white dark:text-black rounded-xl text-xs font-bold py-3.5 flex justify-center items-center gap-1.5">
                    <span id="savePromptSpinner" class="hidden animate-spin h-3.5 w-3.5 border-2 border-current border-t-transparent rounded-full"></span>
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL AJUSTES / SYNC -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeSettingsModal()"></div>
        <div class="bg-white dark:bg-[#121216] border border-gray-200 dark:border-white/10 w-full max-w-xs p-6 relative z-10 rounded-[28px] shadow-2xl text-center">
            <svg class="w-8 h-8 mx-auto text-indigo-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <h2 class="font-montserrat font-bold text-lg dark:text-white mb-4">Sincronización</h2>
            <button onclick="pushLocalDataToSheets()" id="btnPushDrive" class="w-full bg-gray-100 dark:bg-[#1C1C22] text-gray-900 dark:text-white text-[10px] font-bold uppercase py-3 rounded-xl mb-2 flex justify-center items-center gap-1.5"><span id="pushSpinner" class="hidden animate-spin h-3 w-3 border-2 border-current border-t-transparent rounded-full"></span>Subir Datos a Drive</button>
            <button onclick="fetchPrompts(true)" class="w-full bg-gray-900 text-white dark:bg-white dark:text-black text-[10px] font-bold uppercase py-3 rounded-xl mb-4 flex justify-center items-center gap-1.5">Recargar desde Drive</button>
            <button onclick="closeSettingsModal()" class="text-xs text-gray-400 font-bold uppercase tracking-wider">Cerrar</button>
        </div>
    </div>

    <!-- TOAST NOTIFICACIONES -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-gray-900 dark:bg-white text-white dark:text-black px-5 py-2.5 rounded-full text-[10px] font-bold tracking-wider uppercase opacity-0 transition-opacity duration-300 z-[80] shadow-xl pointer-events-none">Mensaje</div>

    <script>
        // ESTA URL DEBE SER TU NUEVA IMPLEMENTACIÓN DE APPS SCRIPT LUEGO DE COPIAR EL CÓDIGO
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbxdrh2FqupvEOwxhHPBxnrpfnQBkm3iu9wZ_0qpD0HJXImYUWSCpQ4um7yLs1IWlB_mfg/exec';

        let currentTab = 'imagenes';
        let currentPeopleFilter = 'all';
        let currentTagFilter = 'all';
        let searchQuery = '';
        let prompts = [];
        
        let activePromptId = null;
        let activeModalBlockId = 'b1';
        let isDomBuilt = false;

        let base64UploadCache = { data: null, name: "" };
        let multiTagContext = null;
        let tempSelectedTags = [];

        // Tags por defecto
        let SUBCATEGORIES = JSON.parse(localStorage.getItem('prompt_tags_v9')) || {
            imagenes: ['Full Body', 'Sentados', 'Piso', 'Close-Up'],
            outfits: ['Editorial', 'Streetwear', 'Casual'],
            modificadores: ['Peinado', 'Color', 'Prenda']
        };

        function saveSubcategoriesToLocal() { localStorage.setItem('prompt_tags_v9', JSON.stringify(SUBCATEGORIES)); }

        // MÉTODOS UI BÁSICOS
        function showToast(msg) {
            const toast = document.getElementById('toast');
            if(!toast) return;
            toast.textContent = msg; toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        function getFormattedDate() { return new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: '2-digit' }); }

        function executeCopy(text) {
            const temp = document.createElement("textarea"); temp.value = text;
            document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('prompt_archive_theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#08080A' : '#f8f9fa');
        }

        function initTheme() {
            const isDark = (localStorage.getItem('prompt_archive_theme') || 'light') === 'dark';
            if (isDark) document.documentElement.classList.add('dark');
            document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#08080A' : '#f8f9fa');
        }

        // CONTROL DE BÚSQUEDA Y FILTROS
        function toggleSearchBar() {
            const input = document.getElementById('searchInput');
            if (input.classList.contains('w-0')) {
                input.classList.remove('w-0', 'opacity-0', 'px-0');
                input.classList.add('w-48', 'sm:w-64', 'opacity-100', 'px-4');
                input.focus();
            } else {
                input.classList.add('w-0', 'opacity-0', 'px-0');
                input.classList.remove('w-48', 'sm:w-64', 'opacity-100', 'px-4');
                input.value = '';
                handleSearchInput('');
            }
        }

        function handleSearchInput(val) { searchQuery = val.trim(); applyFilters(); }

        function toggleFilterMenu() {
            const m = document.getElementById('filterDropdown');
            m.classList.toggle('hidden');
            if (!m.classList.contains('hidden')) renderFilterDropdown();
        }

        document.addEventListener('click', (e) => {
            const btn = document.querySelector('.relative > button[onclick="toggleFilterMenu()"]');
            const menu = document.getElementById('filterDropdown');
            if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function switchTab(tab) {
            currentTab = tab; currentPeopleFilter = 'all'; currentTagFilter = 'all';
            updateFloatingMenuStyles(); applyFilters();
        }

        function switchPeopleFilter(val) { currentPeopleFilter = String(val); updateFloatingMenuStyles(); applyFilters(); }
        function switchTagFilter(tag) { currentTagFilter = String(tag); updateFloatingMenuStyles(); applyFilters(); }

        function renderFilterDropdown() {
            const pSec = document.getElementById('filterPeopleSection');
            if (currentTab === 'imagenes' || currentTab === 'videos') {
                pSec.classList.remove('hidden');
                ['all', '1', '2', '3'].forEach(v => {
                    const el = document.getElementById('fBtn_' + v);
                    if (el) el.className = currentPeopleFilter === v ? "flex-1 py-1 text-[10px] font-bold rounded bg-white dark:bg-white/10 text-black dark:text-white shadow-sm transition-all" : "flex-1 py-1 text-[10px] font-bold rounded text-gray-500 hover:text-black dark:hover:text-white transition-all";
                });
            } else { pSec.classList.add('hidden'); }

            const tSec = document.getElementById('filterTagsSection');
            if (currentTab !== 'videos') {
                tSec.classList.remove('hidden');
                const list = SUBCATEGORIES[currentTab] || [];
                document.getElementById('filterTagsList').innerHTML = ['all', ...list].map(tag => {
                    const isAct = currentTagFilter === tag;
                    const css = isAct ? "bg-indigo-600 text-white border-indigo-600" : "bg-transparent text-gray-500 dark:text-white/60 border-gray-200 dark:border-white/10 hover:border-gray-400";
                    return `<button onclick="switchTagFilter('${tag.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded text-[10px] font-bold border transition-colors ${css}">${tag === 'all' ? 'Todos' : tag}</button>`;
                }).join('');
            } else { tSec.classList.add('hidden'); }
        }

        function updateFloatingMenuStyles() {
            ['imagenes', 'outfits', 'modificadores', 'videos'].forEach(t => {
                const btn = document.getElementById('tabBtn_' + t);
                if (btn) btn.className = currentTab === t ? "flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold bg-gray-900 text-white dark:bg-white dark:text-black shadow-sm transition-all" : "flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-full text-xs font-bold text-gray-500 dark:text-white/60 hover:text-black dark:hover:text-white transition-all";
            });
            document.getElementById('filterActiveDot')?.classList.toggle('hidden', currentPeopleFilter === 'all' && currentTagFilter === 'all');
            renderFilterDropdown();
        }

        // MOTOR RENDER DOM
        function getDriveImageUrl(id, size='w400') { return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`; }

        function buildAllPromptsDOM() {
            const container = document.getElementById('promptCatalog');
            const sorted = [...prompts].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)); // Más nuevos primero según lógica original (o invertido si quieres)
            
            container.innerHTML = sorted.map(prompt => {
                const pCountVal = parseInt(prompt.peopleCount || prompt.personas) || 1;
                const cat = prompt.category || 'imagenes';
                let activeVerLabel = 'v1';
                
                if (cat !== 'videos') {
                    const cIdx = prompt.currentVersionIndex || 0;
                    const ver = (prompt.versions && prompt.versions[cIdx]) || (prompt.versions && prompt.versions[0]);
                    activeVerLabel = ver ? `v${ver.id}` : 'v1';
                } else {
                    const bId = prompt.activeBlockId || 'b1';
                    const ver = prompt.blocks && prompt.blocks[bId] && prompt.blocks[bId].versions[prompt.blocks[bId].currentIdx || 0];
                    activeVerLabel = ver ? `${bId.toUpperCase()} · v${ver.id}` : bId.toUpperCase();
                }

                const tagsStr = (prompt.tag || prompt.subCategory || '').toLowerCase();
                const displayTags = (prompt.tag || prompt.subCategory) ? prompt.tag.split(',')[0].trim() : (cat === 'imagenes' ? 'Pose' : 'Recurso');
                const metaText = (cat === 'imagenes' || cat === 'videos') ? `📍 ${pCountVal} Personas · ${activeVerLabel}` : `📍 ${displayTags} · ${activeVerLabel}`;

                let imgHTML = '';
                if (prompt.demoImg) {
                    imgHTML = `<img src="${prompt.demoImg}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-700 z-10 prompt-img" alt="">`;
                } else if (prompt.thumbnailId) {
                    const src = getDriveImageUrl(prompt.thumbnailId, 'w400');
                    const fb = `https://lh3.googleusercontent.com/d/${prompt.thumbnailId}=w400`;
                    if (cat === 'videos') {
                        // GIFs se cargan solo si se muestran (Lazy real)
                        imgHTML = `<img data-src="${src}" data-fallback="${fb}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-700 z-10 prompt-img video-gif" onerror="this.src=this.dataset.fallback">`;
                    } else {
                        imgHTML = `<img src="${src}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-700 z-10 prompt-img" onerror="this.src='${fb}'">`;
                    }
                }

                const badge = cat === 'videos' ? `<span class="bg-black/60 backdrop-blur-md text-white text-[9px] font-bold px-2 py-0.5 rounded border border-white/10">GIF</span>` : '';

                return `
                    <div data-id="${prompt.id}" data-category="${cat}" data-people="${pCountVal}" data-tags="${tagsStr}" class="prompt-card hidden relative w-full aspect-[9/16] rounded-[24px] overflow-hidden group border border-black/5 dark:border-white/10 shadow-sm hover:shadow-xl transition-all bg-gray-200 dark:bg-[#141418] cursor-pointer" onclick="openImmersiveDetail(${prompt.id})">
                        ${imgHTML}
                        <div class="absolute top-3 left-3 z-20 pointer-events-none">${badge}</div>
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/95 via-black/40 to-transparent z-10 pointer-events-none"></div>
                        <div class="absolute bottom-4 left-4 right-4 z-20 flex items-end justify-between gap-2">
                            <div class="min-w-0 flex-1">
                                <div class="text-white/80 text-[9px] font-bold tracking-wider uppercase mb-1 truncate">${metaText}</div>
                                <h3 class="font-montserrat font-bold text-sm text-white leading-tight line-clamp-2">${prompt.name}</h3>
                            </div>
                            <button onclick="copyCardPrompt(${prompt.id}, event)" class="w-8 h-8 flex-shrink-0 flex items-center justify-center bg-white/20 hover:bg-white hover:text-black backdrop-blur-md border border-white/25 text-white rounded-full transition-all" title="Copiar">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            isDomBuilt = true;
            applyFilters();
        }

        function applyFilters() {
            if (!isDomBuilt) return;
            const cards = document.querySelectorAll('.prompt-card');
            let visibleCount = 0;
            const q = searchQuery.toLowerCase();
            
            cards.forEach(card => {
                let show = true;
                const cat = card.dataset.category;
                const ppl = card.dataset.people;
                const tags = card.dataset.tags;
                
                if (cat !== currentTab) show = false;
                if (show && currentPeopleFilter !== 'all' && (cat === 'imagenes' || cat === 'videos') && ppl !== currentPeopleFilter) show = false;
                if (show && currentTagFilter !== 'all' && cat !== 'videos' && !tags.includes(currentTagFilter.toLowerCase())) show = false;
                
                if (show && q) {
                    const p = prompts.find(x => x.id === Number(card.dataset.id));
                    if (p) {
                        const mName = (p.name || '').toLowerCase().includes(q);
                        const mTag = tags.includes(q);
                        let mText = false;
                        if (cat !== 'videos') { mText = (p.versions || []).some(v => (v.text || '').toLowerCase().includes(q)); } 
                        else { mText = ['b1','b2','b3'].some(b => (p.blocks[b]?.versions || []).some(v => (v.text || '').toLowerCase().includes(q))); }
                        if (!mName && !mTag && !mText) show = false;
                    }
                }
                
                if (show) {
                    card.classList.remove('hidden'); visibleCount++;
                    const gif = card.querySelector('.video-gif');
                    if (gif && gif.dataset.src && gif.src.startsWith('data:')) gif.src = gif.dataset.src;
                } else {
                    card.classList.add('hidden');
                }
            });
            
            document.getElementById('emptyState').classList.toggle('hidden', visibleCount > 0);
            
            // Staggered layout mobile (Alternar márgenes)
            document.querySelectorAll('.prompt-card:not(.hidden)').forEach((card, idx) => {
                card.classList.remove('sm:mt-0', 'mt-5');
                if (idx % 2 === 1) card.classList.add('mt-5', 'sm:mt-0');
            });
        }

        function copyCardPrompt(id, e) {
            if (e) e.stopPropagation();
            const p = prompts.find(x => x.id === id); if (!p) return;
            let txt = '';
            if (p.category !== 'videos') { txt = p.versions[p.currentVersionIndex || 0]?.text; }
            else { txt = p.blocks[p.activeBlockId || 'b1'].versions[p.blocks[p.activeBlockId || 'b1'].currentIdx || 0]?.text; }
            if (txt) { executeCopy(txt); showToast("Copiado"); }
        }

        // ARCHIVOS Y BASE64
        function triggerFileInput(id) { document.getElementById(id).click(); }

        function handleImageFileSelect(input, cId, imgId) {
            const file = input.files[0];
            if (!file || !file.type.startsWith('image/')) return;

            if (file.type === 'image/gif') {
                if (file.size > 12 * 1024 * 1024) return showToast("GIF mayor a 12MB");
                const r = new FileReader();
                r.onload = e => {
                    base64UploadCache = { data: e.target.result, name: file.name };
                    document.getElementById(imgId).src = e.target.result;
                    document.getElementById(cId).classList.remove('hidden');
                    const ph = document.getElementById('newPromptDropPlaceholder'); if(ph) ph.classList.add('hidden');
                };
                r.readAsDataURL(file);
                return;
            }

            const r = new FileReader();
            r.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height, max = 800; // Resolución mejorada a 800px
                    if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    base64UploadCache = { data: canvas.toDataURL('image/jpeg', 0.85), name: file.name }; // Calidad 85%
                    document.getElementById(imgId).src = base64UploadCache.data;
                    document.getElementById(cId).classList.remove('hidden');
                    const ph = document.getElementById('newPromptDropPlaceholder'); if(ph) ph.classList.add('hidden');
                };
            };
            r.readAsDataURL(file);
        }

        function removeSelectedImage(e, fileId, cId, pId) {
            if (e) e.stopPropagation();
            document.getElementById(fileId).value = "";
            document.getElementById(cId).classList.add('hidden');
            if (pId) document.getElementById(pId).classList.remove('hidden');
            base64UploadCache = { data: null, name: "" };
        }

        // SISTEMA MULTI-TAG
        function openMultiTagModal(ctx) {
            multiTagContext = ctx;
            const cat = ctx === 'new' ? document.getElementById('promptCategory').value : prompts.find(p => p.id === activePromptId).category;
            let current = ctx === 'new' ? document.getElementById('newPromptSelectedTags').dataset.tags : (prompts.find(p => p.id === activePromptId).tag || "");
            
            tempSelectedTags = current.split(',').map(t => t.trim()).filter(Boolean);
            document.getElementById('multiTagModal').classList.remove('hidden');
            renderMultiTagList(cat);
        }

        function renderMultiTagList(cat) {
            const list = SUBCATEGORIES[cat] || [];
            tempSelectedTags.forEach(t => { if (!list.includes(t)) { list.push(t); saveSubcategoriesToLocal(); } });
            
            document.getElementById('multiTagList').innerHTML = list.map(tag => {
                const active = tempSelectedTags.includes(tag);
                const css = active ? "bg-indigo-600 text-white border-indigo-600" : "bg-transparent text-gray-600 dark:text-white/70 border-gray-300 dark:border-white/20";
                return `<div onclick="toggleMultiTag('${tag.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer border transition-colors ${css}">${tag}</div>`;
            }).join('');
        }

        function toggleMultiTag(tag) {
            if (tempSelectedTags.includes(tag)) tempSelectedTags = tempSelectedTags.filter(t => t !== tag);
            else tempSelectedTags.push(tag);
            const cat = multiTagContext === 'new' ? document.getElementById('promptCategory').value : prompts.find(p => p.id === activePromptId).category;
            renderMultiTagList(cat);
        }

        function addAndSelectTag() {
            const val = document.getElementById('multiTagInput').value.trim();
            if (!val) return;
            const cat = multiTagContext === 'new' ? document.getElementById('promptCategory').value : prompts.find(p => p.id === activePromptId).category;
            if (!SUBCATEGORIES[cat]) SUBCATEGORIES[cat] = [];
            if (!SUBCATEGORIES[cat].includes(val)) { SUBCATEGORIES[cat].push(val); saveSubcategoriesToLocal(); }
            if (!tempSelectedTags.includes(val)) tempSelectedTags.push(val);
            document.getElementById('multiTagInput').value = '';
            renderMultiTagList(cat);
        }

        async function applyMultiTags() {
            const str = tempSelectedTags.join(', ');
            if (multiTagContext === 'new') {
                const el = document.getElementById('newPromptSelectedTags');
                el.dataset.tags = str; el.textContent = str || "Sin tags";
            } else {
                const p = prompts.find(p => p.id === activePromptId);
                p.tag = str; p.subCategory = str;
                document.getElementById('detailSelectedTags').textContent = str || "Sin tags";
                await apiSavePrompt(p);
            }
            closeMultiTagModal();
        }

        function closeMultiTagModal() { document.getElementById('multiTagModal').classList.add('hidden'); }

        // MODAL DETALLES
        function openImmersiveDetail(id) {
            const p = prompts.find(x => x.id === id); if (!p) return;
            activePromptId = id; base64UploadCache = { data: null, name: "" };
            document.body.style.overflow = 'hidden';
            document.getElementById('detailModal').classList.remove('hidden');
            renderDetailModal();
        }

        function closeDetailModal() {
            document.body.style.overflow = '';
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('newVersionText').value = '';
            removeSelectedImage(null, 'detailFile', 'detailLocalPreviewContainer', null);
            activePromptId = null;
        }

        function renderDetailModal() {
            const p = prompts.find(x => x.id === activePromptId); if (!p) return;
            const cat = p.category || 'imagenes';
            
            document.getElementById('detailName').textContent = p.name;
            document.getElementById('detailPeoplePill').classList.toggle('hidden', cat !== 'imagenes' && cat !== 'videos');
            document.getElementById('detailPeopleSelect').value = parseInt(p.peopleCount || p.personas) || 1;
            
            document.getElementById('detailTagBtn').classList.toggle('hidden', cat === 'videos');
            document.getElementById('detailSelectedTags').textContent = p.tag || "Sin tags";
            
            document.getElementById('videoBlockSelectorContainer').classList.toggle('hidden', cat !== 'videos');
            if (cat === 'videos') {
                ['b1','b2','b3'].forEach(b => {
                    document.getElementById('modalBlockBtn_'+b).className = b === (p.activeBlockId || 'b1') ? "flex-1 py-1.5 text-[10px] font-bold rounded-lg bg-gray-900 text-white dark:bg-white dark:text-black transition-colors" : "flex-1 py-1.5 text-[10px] font-bold rounded-lg text-gray-500 hover:text-black dark:text-white/60 dark:hover:text-white";
                });
            }

            const bgEl = document.getElementById('detailModalBg');
            const fall = document.getElementById('detailModalBgFallback');
            if (p.demoImg) {
                bgEl.style.display = 'block'; fall.classList.add('hidden'); bgEl.src = p.demoImg;
            } else if (p.thumbnailId) {
                bgEl.style.display = 'block'; fall.classList.add('hidden');
                bgEl.src = getDriveImageUrl(p.thumbnailId, 'w800');
                bgEl.onerror = () => { bgEl.src = `https://lh3.googleusercontent.com/d/${p.thumbnailId}=w800`; };
            } else { bgEl.style.display = 'none'; fall.classList.remove('hidden'); }

            let vers = cat !== 'videos' ? (p.versions || []) : (p.blocks[p.activeBlockId||'b1']?.versions || []);
            let cIdx = cat !== 'videos' ? (p.currentVersionIndex || 0) : (p.blocks[p.activeBlockId||'b1']?.currentIdx || 0);

            document.getElementById('detailVersionsContainer').innerHTML = vers.map((v, i) => {
                const isAct = i === cIdx;
                return `
                    <div class="bg-gray-50 dark:bg-[#121216] border ${isAct?'border-indigo-500':'border-gray-200 dark:border-white/10'} rounded-xl overflow-hidden transition-all">
                        <div onclick="toggleAccordion('verPanel_${i}')" class="px-4 py-3.5 flex justify-between items-center cursor-pointer select-none">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold dark:text-white">v${v.id} — ${v.date}</span>
                                ${isAct ? '<span class="bg-indigo-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded uppercase">Activa</span>' : `<button onclick="activateVersion(${i}, event)" class="bg-gray-200 dark:bg-white/10 text-gray-600 dark:text-white/60 text-[8px] font-bold px-1.5 py-0.5 rounded uppercase hover:text-indigo-500">Activar</button>`}
                            </div>
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                        <div id="verPanel_${i}" class="collapsible-panel">
                            <div class="px-4 pb-4 pt-1 border-t border-gray-200/50 dark:border-white/5">
                                <p class="text-[11px] text-gray-700 dark:text-white/80 font-mono whitespace-pre-wrap mb-3 max-h-40 overflow-y-auto custom-scrollbar">${v.text}</p>
                                <div class="flex gap-2">
                                    <button onclick="executeCopy('${v.text.replace(/'/g, "\\'").replace(/\n/g, '\\n')}'); showToast('Copiado');" class="flex-1 py-2 bg-gray-900 text-white dark:bg-white dark:text-black rounded-lg text-[10px] font-bold uppercase">Copiar Prompt</button>
                                    ${vers.length > 1 ? `<button onclick="deleteVersion(${i})" class="px-3 bg-red-100 text-red-600 rounded-lg"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAccordion(id) { document.getElementById(id)?.classList.toggle('open'); }

        async function updatePeopleCount(e) {
            const p = prompts.find(x => x.id === activePromptId); if(!p) return;
            p.peopleCount = p.personas = parseInt(e.target.value) || 1;
            await apiSavePrompt(p);
        }

        function switchModalBlock(bId) {
            const p = prompts.find(x => x.id === activePromptId); if(!p) return;
            p.activeBlockId = bId; renderDetailModal();
        }

        async function activateVersion(idx, e) {
            if(e) e.stopPropagation();
            const p = prompts.find(x => x.id === activePromptId); if(!p) return;
            if(p.category !== 'videos') p.currentVersionIndex = idx; else p.blocks[p.activeBlockId||'b1'].currentIdx = idx;
            renderDetailModal(); await apiSavePrompt(p);
        }

        async function deleteVersion(idx) {
            const p = prompts.find(x => x.id === activePromptId); if(!p) return;
            let arr = p.category !== 'videos' ? p.versions : p.blocks[p.activeBlockId||'b1'].versions;
            arr.splice(idx, 1);
            arr.forEach((v,i) => v.id = i+1);
            if(p.category !== 'videos') { if(p.currentVersionIndex >= arr.length) p.currentVersionIndex = arr.length-1; }
            else { if(p.blocks[p.activeBlockId||'b1'].currentIdx >= arr.length) p.blocks[p.activeBlockId||'b1'].currentIdx = arr.length-1; }
            renderDetailModal(); await apiSavePrompt(p);
        }

        async function saveNewVersion() {
            const p = prompts.find(x => x.id === activePromptId);
            const txt = document.getElementById('newVersionText').value.trim();
            if(!txt) return;
            if(p.category !== 'videos') { p.versions.push({id: p.versions.length+1, text: txt, date: getFormattedDate()}); p.currentVersionIndex = p.versions.length-1; }
            else { p.blocks[p.activeBlockId||'b1'].versions.push({id: p.blocks[p.activeBlockId||'b1'].versions.length+1, text: txt, date: getFormattedDate()}); p.blocks[p.activeBlockId||'b1'].currentIdx = p.blocks[p.activeBlockId||'b1'].versions.length-1; }
            document.getElementById('newVersionText').value = '';
            renderDetailModal(); await apiSavePrompt(p);
        }

        async function updateThumbnailOnly() {
            const p = prompts.find(x => x.id === activePromptId); if(!p || !base64UploadCache.data) return;
            document.getElementById('updateThumbSpinner').classList.remove('hidden');
            p.demoImg = base64UploadCache.data;
            await apiSavePrompt(p);
            document.getElementById('updateThumbSpinner').classList.add('hidden');
            removeSelectedImage(null, 'detailFile', 'detailLocalPreviewContainer', null);
            renderDetailModal();
        }

        async function deleteActivePrompt() {
            if(confirm("¿Eliminar este prompt para siempre?")) {
                prompts = prompts.filter(x => x.id !== activePromptId);
                localStorage.setItem('editorial_prompts_v8', JSON.stringify(prompts));
                closeDetailModal(); buildAllPromptsDOM();
                try { await fetch(webAppUrl, { method: 'POST', mode: 'cors', body: JSON.stringify({action: 'delete', id: activePromptId})}); } catch(e){}
            }
        }

        // CREAR PROMPT
        function openNewPromptModal() {
            document.getElementById('promptCategory').value = currentTab;
            handleCategoryChange();
            document.getElementById('newPromptModal').classList.remove('hidden');
        }

        function closeNewPromptModal() {
            document.getElementById('newPromptModal').classList.add('hidden');
            document.getElementById('promptName').value = '';
            document.getElementById('promptText').value = '';
            document.getElementById('block1Text').value = '';
            document.getElementById('block2Text').value = '';
            document.getElementById('block3Text').value = '';
            const tEl = document.getElementById('newPromptSelectedTags');
            if(tEl) { tEl.dataset.tags = ""; tEl.textContent = "Seleccionar tags..."; }
            removeSelectedImage(null, 'newPromptFile', 'newPromptPreviewContainer', 'newPromptDropPlaceholder');
        }

        function handleCategoryChange() {
            const cat = document.getElementById('promptCategory').value;
            document.getElementById('singlePromptFieldContainer').classList.toggle('hidden', cat === 'videos');
            document.getElementById('videoBlocksFieldContainer').classList.toggle('hidden', cat !== 'videos');
            document.getElementById('newPromptPeopleWrapper').classList.toggle('hidden', cat !== 'imagenes' && cat !== 'videos');
            
            const tEl = document.getElementById('newPromptSelectedTags');
            if(tEl) { tEl.dataset.tags = ""; tEl.textContent = "Seleccionar tags..."; }
        }

        async function saveNewPrompt() {
            const cat = document.getElementById('promptCategory').value;
            const name = document.getElementById('promptName').value.trim();
            if(!name) return showToast("Falta Título");
            
            const tags = document.getElementById('newPromptSelectedTags').dataset.tags || "";
            const obj = { id: Date.now(), category: cat, name: name, date: getFormattedDate(), peopleCount: parseInt(document.getElementById('promptPeople').value)||1, personas: parseInt(document.getElementById('promptPeople').value)||1, subCategory: tags, tag: tags, demoImg: base64UploadCache.data||'' };
            
            if(cat !== 'videos') { obj.versions = [{id:1, text: document.getElementById('promptText').value.trim(), date: getFormattedDate()}]; obj.currentVersionIndex = 0; }
            else { obj.blocks = { b1:{versions:[{id:1, text:document.getElementById('block1Text').value.trim(), date:getFormattedDate()}], currentIdx:0}, b2:{versions:[{id:1, text:document.getElementById('block2Text').value.trim(), date:getFormattedDate()}], currentIdx:0}, b3:{versions:[{id:1, text:document.getElementById('block3Text').value.trim(), date:getFormattedDate()}], currentIdx:0}}; obj.activeBlockId = 'b1'; }

            document.getElementById('savePromptSpinner').classList.remove('hidden');
            await apiSavePrompt(obj);
            document.getElementById('savePromptSpinner').classList.add('hidden');
            
            closeNewPromptModal(); switchTab(cat);
        }

        // RED & SYNC
        async function fetchPrompts(fromModal=false) {
            const icon = document.getElementById('syncHeaderIcon');
            if(icon) { icon.classList.add('animate-spin', 'text-indigo-500'); }
            if(fromModal) closeSettingsModal();

            try {
                const res = await fetch(webAppUrl + '?t=' + Date.now(), { method: 'GET', mode: 'cors' });
                if(res.ok) {
                    const data = await res.json();
                    if(Array.isArray(data)) { prompts = data; localStorage.setItem('editorial_prompts_v8', JSON.stringify(prompts)); }
                }
            } catch(e) { prompts = JSON.parse(localStorage.getItem('editorial_prompts_v8')) || []; }
            
            if(icon) {
                icon.classList.remove('animate-spin', 'text-indigo-500');
                icon.classList.add('text-green-500');
                setTimeout(() => icon.classList.remove('text-green-500'), 2500);
            }
            buildAllPromptsDOM();
        }

        async function apiSavePrompt(p) {
            const idx = prompts.findIndex(x => x.id === p.id); if(idx>-1) prompts[idx]=p; else prompts.unshift(p);
            
            // Proteger LocalStorage de GIFs enormes
            const safe = prompts.map(pr => { let c={...pr}; if(c.demoImg && c.demoImg.length > 250000) c.demoImg=''; return c; });
            try { localStorage.setItem('editorial_prompts_v8', JSON.stringify(safe)); } catch(e){}
            buildAllPromptsDOM();

            try {
                const res = await fetch(webAppUrl, { method: 'POST', mode: 'cors', body: JSON.stringify({action: 'save', prompt: p, imageBase64: base64UploadCache.data, imageName: base64UploadCache.name})});
                const json = await res.json();
                if(json.success && json.thumbnailId) {
                    p.thumbnailId = json.thumbnailId; p.demoImg = '';
                    const safe2 = prompts.map(pr => { let c={...pr}; if(c.demoImg && c.demoImg.length > 250000) c.demoImg=''; return c; });
                    localStorage.setItem('editorial_prompts_v8', JSON.stringify(safe2));
                    buildAllPromptsDOM();
                }
            } catch(e){}
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        async function pushLocalDataToSheets() {
            document.getElementById('pushSpinner').classList.remove('hidden');
            try { await fetch(webAppUrl, { method: 'POST', mode: 'cors', body: JSON.stringify({action: 'syncAll', prompts: prompts})}); } catch(e){}
            document.getElementById('pushSpinner').classList.add('hidden');
            closeSettingsModal(); showToast("Subida completada");
        }

        window.onload = () => {
            initTheme();
            prompts = JSON.parse(localStorage.getItem('editorial_prompts_v8')) || [];
            updateFloatingMenuStyles(); buildAllPromptsDOM(); fetchPrompts();
        };
    </script>
</body>
</html>
